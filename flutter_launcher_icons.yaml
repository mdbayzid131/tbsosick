flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  
  # iOS এ transparent background allowed না, তাই white bg দেওয়া হয়েছে
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
